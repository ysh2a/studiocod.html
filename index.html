<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>visualstudio Download</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #c6d1ff, #26128a);
    display: flex;
    justify-content: center;   
    align-items: center;       
}

.studio {
    display: flex;
    gap: 80px;
    align-items: center;
}

.text h1 {
    font-size: 60px;
    margin-bottom: 20px;
    color: #134ff5;
}

.text h2 {
    font-size: 20px;
    margin-top: 20px;
    color: rgb(6, 68, 240);
}

.text h3 {
    font-size: 15px;
    margin-top: 12px;
    color: rgb(5, 5, 5);
}

.text p {
    font-size: 25px;
    margin-bottom: 20px;
    margin-top: -7%;
    color: rgb(6, 68, 240);
}

.btn {
    padding: 15px 30px;
    background: #0078D4;
    color: white;
    /*text-decoration: none;*/
    border-radius: 6px;
    font-weight: bold;
    transition: 0.3s;
    font-size: 20px;
}

.btn:hover {
    background: #2899f5;
    box-shadow: 0 0 15px rgba(40,153,245,0.7);
}

.code-box {
    width: 420px;
    height: 280px;
    background: #1e1e1e;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 0 25px rgba(0,0,0,0.5);
    font-family: monospace;
    position: relative;
}

.code-box::before {
    content: "";
    position: absolute;
    top: 10px;
    left: 15px;
    width: 10px;
    height: 10px;
    background: #ff5f56;
    border-radius: 50%;
    box-shadow: 18px 0 #ffbd2e, 36px 0 #27c93f;
}

.code {
    margin-top: 30px;
    color: #dcdcdc;
    font-size: 14px;
    line-height: 1.6;
}

.keyword { color: #569cd6; }
.func { color: #dcdcaa; }
.string { color: #ce9178; }

.logo {
    top: -120px;
    left: 1%;
}

@media (max-width: 900px) {
    .studio {
        flex-direction: column;
        text-align: center;
    }
}
</style>
</head>

<body>

<div class="studio">
    <div class="text">
        <h1>비주얼 스튜디오</h1>
        <p>자바스크립트</p>
        <h2>오픈 소스 AI 코드 편집기<br>다수의 에이전트 개발을 위한 최적의 플랫폼</h2>
        <a href="https://code.visualstudio.com/" class="btn">무료 다운로드</a> <br>
        <h3>windows(1.2GB)</h3>
    </div>

    <div class="code-box">
        <div class="code">
            1 <span class="keyword">function</span> <span class="func">startApp</span>() { <br>
            2&nbsp;&nbsp;<span class="keyword">const</span> msg = <span class="string">"Hello Developer"</span>; <br>
            3&nbsp;&nbsp;console.log(msg); } <br>
            4 <span class="func">startApp</span>(visualstudio); <br>
            5 <span class="func">code</span>(_);
        </div>
    </div>
</div>

</body>
</html>
